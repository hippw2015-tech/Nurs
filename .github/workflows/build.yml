name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Harden (no backup, no screenshots)
        run: |
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/nursing/schedule/MainActivity.java <<'J'
          package com.nursing.schedule;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b){
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,WindowManager.LayoutParams.FLAG_SECURE);
              super.onCreate(b);
            }
          }
          J
      - name: Icon
        run: if [ -f resources/icon.png ]; then npx capacitor-assets generate --android; fi
      - run: npx cap sync android
      - name: Build and sign with the FIXED key
        env:
          KS_PASS: f4e1c8da3d062acc85778f60
        run: |
          cd android
          ./gradlew assembleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../al.apk
          $BT/apksigner sign --ks ../signing/release.p12 --ks-type PKCS12 --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --ks-key-alias nurse --out ../app.apk ../al.apk
          $BT/apksigner verify --print-certs ../app.apk | head -3
      - uses: actions/upload-artifact@v4
        with: {name: nursing-apk, path: app.apk}
